<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 145" width="100%" height="100%">
  <defs>
    <radialGradient id="tc_shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tc_crust_side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="25%" stop-color="#b45309"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="tc_crust_top" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="tc_ridge_glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="tc_cut_wall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="tc_blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- 1. Bóng đổ bánh 3D -->
  <ellipse cx="80" cy="122" rx="60" ry="15" fill="url(#tc_shadow)" filter="url(#tc_blur)"/>

  <!-- 2. Khối trụ thành bánh nướng 3D (Thành bánh có chiều sâu) -->
  <g id="cake_body">
    <!-- Nền thành bánh cong -->
    <path d="M 22 58 C 22 82, 138 82, 138 58 L 138 92 C 138 116, 22 116, 22 92 Z" fill="url(#tc_crust_side)"/>

    <!-- Các múi nướng dọc thành bánh (16 múi nướng đặc trưng bánh trung thu) -->
    <!-- Múi bên trái -->
    <path d="M 24 62 C 24 85, 34 87, 34 65 L 34 99 C 34 121, 24 119, 24 96 Z" fill="#451a03" opacity="0.35"/>
    <path d="M 34 65 C 34 88, 48 90, 48 68 L 48 102 C 48 124, 34 122, 34 99 Z" fill="#78350f" opacity="0.25"/>
    <path d="M 48 68 C 48 91, 64 93, 64 71 L 64 105 C 64 127, 48 125, 48 102 Z" fill="#b45309" opacity="0.2"/>
    <!-- Múi chính diện -->
    <path d="M 64 71 C 64 93, 80 94, 80 72 L 80 106 C 80 128, 64 127, 64 105 Z" fill="#f59e0b" opacity="0.15"/>
    <path d="M 80 72 C 80 94, 96 93, 96 71 L 96 105 C 96 127, 80 128, 80 106 Z" fill="#b45309" opacity="0.2"/>
    <path d="M 96 71 C 96 90, 112 88, 112 68 L 112 102 C 112 122, 96 124, 96 105 Z" fill="#78350f" opacity="0.3"/>
    <path d="M 112 68 C 112 87, 126 85, 126 64 L 126 98 C 126 119, 112 121, 112 102 Z" fill="#451a03" opacity="0.45"/>

    <!-- Gờ rãnh nướng bóng -->
    <path d="M 23 93 C 40 115, 120 115, 137 93" fill="none" stroke="#451a03" stroke-width="2.5" opacity="0.8"/>
    <path d="M 24 95 C 40 116, 120 116, 136 95" fill="none" stroke="#fef08a" stroke-width="1.2" opacity="0.4"/>
  </g>

  <!-- 3. Mặt trên bánh nướng hình cánh hoa dập nổi (Top Pattern Surface) -->
  <g id="cake_top">
    <!-- Nền mặt trên elip -->
    <ellipse cx="80" cy="58" rx="58" ry="24" fill="url(#tc_crust_top)" stroke="#451a03" stroke-width="1.8"/>

    <!-- Cánh hoa viền ngoài dập nổi (16 múi hoa truyền thống quanh vành) -->
    <path d="M 23 58 C 24 53, 30 52, 33 55 C 37 50, 44 49, 48 53 C 53 47, 61 47, 65 51 C 71 46, 79 46, 83 50 C 89 46, 97 46, 101 51 C 107 47, 115 47, 119 53 C 124 49, 131 50, 134 55 C 137 53, 140 55, 137 58 C 140 61, 137 63, 134 61 C 131 66, 124 67, 119 63 C 115 69, 107 69, 101 65 C 97 70, 89 70, 83 66 C 79 70, 71 70, 65 65 C 61 69, 53 69, 48 63 C 44 67, 37 66, 33 61 C 30 64, 24 63, 23 58 Z" fill="none" stroke="#fef08a" stroke-width="1.6" opacity="0.75"/>

    <!-- Vòng tròn chạm nổi hoa văn cổ truyền thứ 2 -->
    <ellipse cx="80" cy="58" rx="44" ry="18" fill="#b45309" stroke="#fef08a" stroke-width="1.4" opacity="0.9"/>
    <ellipse cx="80" cy="58" rx="38" ry="15.5" fill="url(#tc_crust_top)" stroke="#78350f" stroke-width="1.2"/>

    <!-- Vòng tâm chạm hoa văn hoa cúc / hoa sen mùa thu truyền thống -->
    <ellipse cx="80" cy="58" rx="26" ry="10.5" fill="#78350f" stroke="#fef08a" stroke-width="1.2" opacity="0.95"/>

    <!-- Cánh hoa sen dập nổi trung tâm -->
    <g stroke="#fef08a" stroke-width="1.3" fill="none" opacity="0.9">
      <!-- 8 cánh hoa cách đều -->
      <path d="M 80 48 C 77 52, 77 55, 80 58 C 83 55, 83 52, 80 48 Z" fill="#f59e0b"/>
      <path d="M 80 68 C 77 64, 77 61, 80 58 C 83 61, 83 64, 80 68 Z" fill="#f59e0b"/>
      <path d="M 58 58 C 62 55, 65 55, 68 58 C 65 61, 62 61, 58 58 Z" fill="#f59e0b"/>
      <path d="M 102 58 C 98 55, 95 55, 92 58 C 95 61, 98 61, 102 58 Z" fill="#f59e0b"/>
      <path d="M 65 51 C 69 50, 72 52, 73 55 C 70 55, 67 53, 65 51 Z" fill="#b45309"/>
      <path d="M 95 51 C 91 50, 88 52, 87 55 C 90 55, 93 53, 95 51 Z" fill="#b45309"/>
      <path d="M 65 65 C 69 66, 72 64, 73 61 C 70 61, 67 63, 65 65 Z" fill="#b45309"/>
      <path d="M 95 65 C 91 66, 88 64, 87 61 C 90 61, 93 63, 95 65 Z" fill="#b45309"/>
    </g>

    <!-- Nhụy hoa tâm bánh nướng trứng bóng -->
    <ellipse cx="80" cy="58" rx="8" ry="4" fill="#fef08a" stroke="#451a03" stroke-width="1"/>
    <ellipse cx="78.5" cy="56.8" rx="2.5" ry="1.2" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- 4. Mặt Cắt Miếng Bánh 3D Hé Lộ Nhân (Góc trước bên phải, tạo điểm nhấn chuẩn bánh trung thu) -->
  
  <g id="cut_slice">
    <!-- Miếng cắt lộ nhân góc trước -->
    <!-- Thành vỏ bánh nướng dày ~3mm -->
    <path d="M 80 58 L 126 69 L 126 103 L 80 92 Z" fill="#92400e" stroke="#451a03" stroke-width="1"/>
    <!-- Lòng nhân thập cẩm xá xíu thơm lừng -->
    <path d="M 82 60 L 123 70 L 123 100 L 82 90 Z" fill="#78350f"/>
    <!-- Kết cấu lạp xưởng đỏ, xá xíu, hạt sen, mứt bí -->
    <g>
      <!-- Hạt sen bùi vàng ngà -->
      <circle cx="89" cy="69" r="3.2" fill="#fde68a"/>
      <circle cx="114" cy="78" r="3" fill="#fde68a"/>
      <circle cx="102" cy="91" r="3.5" fill="#fde68a"/>
      <!-- Lạp xưởng xá xíu đỏ au đậm đà -->
      <rect x="94" y="66" width="6" height="4" rx="1.5" fill="#dc2626" transform="rotate(12 97 68)"/>
      <rect x="108" y="72" width="7" height="4" rx="1.5" fill="#b91c1c" transform="rotate(-15 111 74)"/>
      <rect x="86" y="81" width="6" height="3.5" rx="1.5" fill="#dc2626" transform="rotate(25 89 83)"/>
      <rect x="110" y="87" width="7" height="4" rx="1.5" fill="#991b1b" transform="rotate(8 113 89)"/>
      <!-- Mứt bí giòn trong và mè rang -->
      <circle cx="95" cy="85" r="1.5" fill="#ffffff" opacity="0.8"/>
      <circle cx="118" cy="84" r="1.5" fill="#ffffff" opacity="0.8"/>
      <circle cx="106" cy="68" r="1.2" fill="#ffffff" opacity="0.9"/>
    </g>
    <!-- Quả trứng muối đỏ au vàng óng lộ diện ở tâm cắt -->
    <ellipse cx="98" cy="79" rx="8" ry="6.5" fill="#f59e0b" stroke="#fef08a" stroke-width="1.2"/>
    <ellipse cx="98" cy="79" rx="6" ry="5" fill="#ea580c"/>
    <ellipse cx="96" cy="77" rx="2" ry="1.5" fill="#ffffff" opacity="0.85"/>
  </g>

</svg>